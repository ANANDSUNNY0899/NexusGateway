version: "3.0"
metadata:
  org: "Nexus-Infrastructure-Global"
  security_level: "High-Sovereign"

rules:
  # 1. MEDICAL DATA (Hospitals)
  - id: "DLP_MEDICAL"
    name: "Patient_Identity_Shield"
    action: "REDACT"
    pattern: "(?i)(patient_id|ssn|mrn):?\\s*[0-9A-Z-]+"
    message: "[REDACTED_MEDICAL_DATA]"

  # 2. FINANCIAL DATA (Banks)
  - id: "DLP_FINANCE"
    name: "Asset_Privacy_Shield"
    action: "REDACT"
    pattern: "(?i)(iban|card_number|cvv|swift):?\\s*[A-Z0-9]+"
    message: "[REDACTED_FINANCIAL_DATA]"

  # 3. NEXUS SECURITY (Anti-Jailbreak)
  - id: "SEC_JAILBREAK"
    name: "Instructional_Integrity"
    action: "BLOCK"
    keywords: ["ignore all previous instructions", "system prompt leak", "bypass safety"]
    refusal_msg: "Nexus Sovereign Shield: Protocol violation. Instructional override detected."

  # 4. LEGAL COMPLIANCE
  - id: "LEG_ADVICE"
    name: "Liability_Disclaimer"
    action: "DISCLAIMER"
    keywords: ["bitcoin", "stock", "invest", "medical advice", "prescription"]
    disclaimer_text: "\n\n[Nexus Protocol Disclaimer]: This response is generated by AI. Consult a certified professional for medical or financial decisions."